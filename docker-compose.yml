services:
  db:
    image: postgres:16-alpine          # PostgreSQL 16, imagem leve
    container_name: financial-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}          # lidos do .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                     # porta do seu PC : porta do container
    volumes:
      - pgdata:/var/lib/postgresql/data # dados sobrevivem ao desligar o container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:                               # volume nomeado